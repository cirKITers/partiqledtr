[project]
name = "partiqledtr"
version = "0.1.0"
description = "Particle decay tree reconstruction (LCAG) with quantum Fourier models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flax>=0.12.9",
    "qml-essentials",
    "optax>=0.2.8",
    "numpy>=2",
    "matplotlib>=3.9",
    "fluksio>=0.1.1",
    "phasespace-jax",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
qml-essentials = { git = "https://github.com/cirKITers/qml-essentials", rev = "07d325fefb6fab1b84eb32ccb16e42dcbe4994ea" }
phasespace-jax = { git = "https://github.com/stroblme/phasespace-jax", rev = "983a6b2ef25962c4077a4fcb69d0a25e70e23bfc" }

[dependency-groups]
dev = ["ruff>=0.12", "ty", "pytest>=8"]

[tool.ruff]
line-length = 100
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF", "D"]
ignore = ["D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ty.src]
include = ["partiqledtr", "tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gen: runs phase-space generation (slower, and enables JAX x64)"]
