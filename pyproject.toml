[project]
name = "partiqledtr"
version = "0.1.0"
description = "Particle decay tree reconstruction (LCAG) with quantum Fourier models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flax>=0.12.9",
    "optax>=0.2.8",
    "numpy>=2.3",
    "matplotlib>=3.9",
    "qml-essentials",
    "phasespace-jax>=2.0.0",
    "fluksio",
]

gpu = ["jax[cuda12]>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
qml-essentials = { git = "https://github.com/cirKITers/qml-essentials", rev = "59ed6adde3071a3075dd53b1efea016014c015dd" }
fluksio = { git = "https://git.stroblme.de/Fluksio/app", rev = "e2f97d36e428a0448dd79e0ab1ae7b750801270e", subdirectory = "backend" }

[dependency-groups]
dev = ["ruff>=0.12", "ty", "pytest>=8"]

[tool.ruff]
line-length = 100
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF", "D"]
ignore = ["D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ty.src]
include = ["partiqledtr", "tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gen: runs phase-space generation (slower)"]
